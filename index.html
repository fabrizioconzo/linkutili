<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRR Tools</title>

<!-- FAVICON CGN -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <rect width='100' height='100' rx='18' fill='%232c6da2'/>
  <rect x='25' y='25' width='20' height='20' fill='white'/>
  <rect x='55' y='25' width='20' height='20' fill='white'/>
  <rect x='25' y='55' width='20' height='20' fill='white'/>
  <rect x='55' y='55' width='20' height='20' fill='white'/>
</svg>">

<style>
:root{
  --brand:#2c6da2;
  --bg:#f5f8fb;
  --border:#c5d8ea;
  --text-gray:#6b6b6b;
}

/* RESET */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
}

/* HEADER */
.header{
  background:var(--brand);
  color:#fff;
  padding:16px 20px;
  font-size:18px;
  font-weight:700;
}

/* LAYOUT RESPONSIVE */
.main{
  width:100%;
  max-width:750px;
  margin:auto;
  padding:16px;
}

/* TITLE */
.section-title{
  font-size:18px;
  font-weight:700;
  color:var(--text-gray);
  margin-bottom:10px;
  padding:0 12px;
}

/* CARD */
.link-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
  position:relative;
  width:100%;
}

.link-title{
  font-weight:700;
  color:var(--brand);
  text-decoration:none;
  display:block;
  margin-right:30px;
}

.link-url{
  font-size:12px;
  color:#666;
  margin-right:30px;
  word-break:break-all;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:6px;
  margin-top:10px;
  margin-right:30px;
}

.btn{
  font-size:11px;
  padding:5px 8px;
  border:1px solid var(--border);
  background:#f8fbff;
  border-radius:6px;
  cursor:pointer;
}

/* HANDLE */
.handle{
  position:absolute;
  right:10px;
  bottom:10px;
  cursor:grab;
  font-size:18px;
  color:#888;
}

/* ================= BOTTOM AREA ALLINEATA ALLE CARD ================= */
.bottom-area{
  width:100%;
  margin-top:8px;
  padding:0; /* niente offset extra */
}

/* pulsante = stessa larghezza card */
.main-btn{
  width:100%;
  background:var(--brand);
  color:#fff;
  border:none;
  padding:12px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

/* FORM = stessa larghezza pulsante/card */
.form{
  display:none;
  width:100%;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-top:8px;
}

.form.show{
  display:block;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:8px;
}

/* SAVE */
.save-btn{
  width:100%;
  background:var(--brand);
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

/* DRAG */
.dragging{
  opacity:0.5;
}

/* ================= RESPONSIVE MOBILE ================= */
@media (max-width:600px){

  .main{
    padding:12px;
  }

  .section-title{
    font-size:16px;
    padding:0 8px;
  }

  .link-card{
    padding:10px;
  }

  .actions{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div class="header">Link Utili</div>

<div class="main">

<div class="section-title">Link Utili</div>

<div id="list"></div>

<!-- BUTTON + FORM (RESPONSIVE E ALLINEATI) -->
<div class="bottom-area">

  <button class="main-btn" onclick="toggleForm()">
    Aggiungi Link
  </button>

  <div class="form" id="form">
    <input id="title" placeholder="Titolo">
    <input id="url" placeholder="https://...">
    <button class="save-btn" onclick="addLink()">Salva Link</button>
  </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiwYRo8R61WefbiIk1AKmlYnM_HNl51M8",
  authDomain: "link-utili.firebaseapp.com",
  projectId: "link-utili",
  storageBucket: "link-utili.firebasestorage.app",
  messagingSenderId: "920848158405",
  appId: "1:920848158405:web:7636be9b2a20285228aaac"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");
const form = document.getElementById("form");

/* REALTIME */
onSnapshot(collection(db,"links"), snap=>{
  let data=[];
  snap.forEach(d=>data.push({id:d.id,...d.data()}));

  list.innerHTML="";
  data.sort((a,b)=>(a.order||0)-(b.order||0));
  data.forEach(i=>list.appendChild(card(i)));
});

/* CARD */
function card(i){
  const div=document.createElement("div");
  div.className="link-card";
  div.dataset.id=i.id;

  div.innerHTML=`
    <a class="link-title" href="${i.url}" target="_blank">${i.title}</a>
    <div class="link-url">${i.url}</div>

    <div class="actions">
      <button class="btn" onclick="edit('${i.id}','${i.title}','${i.url}')">Modifica</button>
      <button class="btn" onclick="confirmDelete('${i.id}')">Elimina</button>
    </div>

    <div class="handle">☰</div>
  `;

  return div;
}

/* ADD */
window.addLink=async()=>{
  await addDoc(collection(db,"links"),{
    title:title.value,
    url:url.value,
    order:Date.now()
  });

  title.value="";
  url.value="";
  form.classList.remove("show");
};

/* FORM */
window.toggleForm=()=>{
  form.classList.toggle("show");
};

/* DELETE */
window.confirmDelete=(id)=>{
  if(confirm("Confermi eliminazione?")) del(id);
};

window.del=async(id)=>{
  await deleteDoc(doc(db,"links",id));
};

/* EDIT */
window.edit=async(id,t,u)=>{
  const nt=prompt("Titolo",t);
  if(nt===null) return;
  const nu=prompt("URL",u);
  if(nu===null) return;
  await updateDoc(doc(db,"links",id),{title:nt,url:nu});
};

</script>

</body>
</html>
